settings {
    logfile = "/var/log/lsyncd/lsyncd.log",
    statusFile = "/var/log/lsyncd/lsyncd.status",
    inotifyMode = "CloseWrite",
}

-- Синхронизация Tomcat
sync {
    default.rsyncssh,
    source = "/path",
    host = "lsyncd-test@host",
    targetdir = "/path",

    maxProcesses = 1,

    delay = 5,

    -- Параметры rsync
    rsync = {
        binary = "/usr/bin/rsync",
        archive = true,
        compress = true,
        verbose = true,
        owner = true,
        group = true,
        perms = true,
        _extra = {"-O"}
    },

    -- Правила исключения
    exclude = {
        "/logs/*",
        "/temp/*"
    },

    -- Параметры SSH
    ssh = {
        port = 22,
        identityFile = "/home/lsyncd-test/.ssh/id_ed25519",
        options = {StrictHostKeyChecking="no"}
    }
}

-- Синхронизация Application
sync {
    default.rsyncssh,
    source = "/path",
    host = "lsyncd-test@hostname",
    targetdir = "/path/",

    maxProcesses = 1,

    delay = 5,

    rsync = {
        binary = "/usr/bin/rsync",
        archive = true,
        compress = true,
        verbose = true,
        owner = true,
        group = true,
        perms = true,
        _extra = {"-O"}
    },

    -- Правила исключения
    exclude = {
        "/logs/*",
        "/temp/*"
    },

    -- Параметры SSH
    ssh = {
        port = 22,
        identityFile = "/home/lsyncd-test/.ssh/id_ed25519",
        options = {StrictHostKeyChecking="no"}
    }
}