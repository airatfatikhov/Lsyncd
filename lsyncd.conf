----
-- User settings
-- Запускаем процессы от имени пользователя jarvis для корректных прав доступа
-- Если lsyncd запущен как root, он может переключаться на jarvis, 
-- но лучше настроить запуск сервиса от jarvis (см. Шаг 4).
----

settings {
    logfile = "/var/log/lsyncd/lsyncd.log",
    statusFile = "/var/log/lsyncd/lsyncd.status",
    inotifyMode = "CloseWrite",
    maxProcesses = 4, -- Максимальное количество параллельных процессов rsync
}

-- Синхронизация Tomcat
sync {
    default.rsyncssh,
    source = "/usr/local/tomcat",
    host = "<DESTINATION_IP>", -- IP второго сервера
    targetdir = "/usr/local/tomcat",
    
    -- Параметры rsync
    rsync = {
        binary = "/usr/bin/rsync",
        archive = true,
        compress = true,
        verbose = true,
        _extra = {"--owner", "--group", "--perms"}, -- Сохраняем владельца, группу и права
    },
    
    -- Параметры SSH
    ssh = {
        port = 22,
        identity_file = "/home/jarvis/.ssh/id_ed25519", -- Путь к приватному ключу пользователя jarvis
    },
    
    -- Исключения (опционально)
    excludeFrom = "/etc/lsyncd.exclude.tomcat", 
}

-- Синхронизация Application
sync {
    default.rsyncssh,
    source = "/usr/local/application",
    host = "<DESTINATION_IP>", -- IP второго сервера
    targetdir = "/usr/local/application",
    
    rsync = {
        binary = "/usr/bin/rsync",
        archive = true,
        compress = true,
        verbose = true,
        _extra = {"--owner", "--group", "--perms"},
    },
    
    ssh = {
        port = 22,
        identity_file = "/home/jarvis/.ssh/id_ed25519",
    },
    
    excludeFrom = "/etc/lsyncd.exclude.app",
}